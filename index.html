<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Chat Practice</title>
  <style>
    [hidden] { display: none !important; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #f4f4f5;
      color: #18181b;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #2563eb;
      color: #fff;
      padding: 12px 16px;
      padding-top: calc(12px + env(safe-area-inset-top, 0px));
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    header h1 { font-size: 1.05rem; margin: 0; }
    #notify {
      background: #fff;
      color: #2563eb;
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      font: inherit;
      font-size: 0.85rem;
      cursor: pointer;
    }
    #status { font-size: 0.8rem; color: #52525b; padding: 4px 16px 0; min-height: 1em; }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .msg {
      max-width: 75%;
      padding: 8px 12px;
      border-radius: 14px;
      background: #e4e4e7;
      align-self: flex-start;
    }
    .msg.mine { background: #2563eb; color: #fff; align-self: flex-end; }
    .msg .who { font-size: 0.75rem; opacity: 0.7; margin-bottom: 2px; }
    .msg .text { white-space: pre-wrap; word-break: break-word; }
    #sendForm {
      display: flex;
      gap: 8px;
      padding: 12px;
      padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
      background: #fff;
      border-top: 1px solid #e4e4e7;
    }
    input {
      flex: 1;
      font: inherit;
      padding: 10px 12px;
      border: 1px solid #d4d4d8;
      border-radius: 10px;
      min-width: 0;
    }
    button.primary {
      font: inherit;
      padding: 10px 16px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: #fff;
      cursor: pointer;
    }
    #join {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    #joinBox {
      background: #fff;
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      max-width: 340px;
    }
    #joinBox h2 { margin: 0 0 6px; font-size: 1.2rem; }
    #joinBox p { color: #52525b; font-size: 0.9rem; margin: 0 0 14px; }
    #joinBox input { width: 100%; margin-bottom: 12px; }
    #joinBox button { width: 100%; }
  </style>
</head>
<body>
  <header>
    <h1>Chat Practice</h1>
    <button id="notify" hidden>Enable notifications</button>
  </header>
  <div id="status"></div>
  <div id="messages"></div>

  <form id="sendForm">
    <input id="text" placeholder="Type a message" autocomplete="off" required>
    <button class="primary" type="submit">Send</button>
  </form>

  <div id="join" hidden>
    <div id="joinBox">
      <h2>Pick a name</h2>
      <p>Use a different name on each device so you can see notifications arrive.</p>
      <form id="joinForm">
        <input id="nameInput" placeholder="Your name" maxlength="30" autocomplete="off" required>
        <button class="primary" type="submit">Join chat</button>
      </form>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/+esm';
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js';
    import { getMessaging, getToken } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-messaging.js';

    const SERVER_URL = 'https://webpushpractice.vercel.app';
    const SUPABASE_URL = 'https://uiintvpemhhwulruggku.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVpaW50dnBlbWhod3VscnVnZ2t1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUyODc1ODYsImV4cCI6MjExMDg2MzU4Nn0.MZe4_xAUIm7LubxhSJ6TmrK4BdAKHPiMIJof6lBnn8E';
    const VAPID_KEY = 'BMloa8L2xHWbIVf9BVdsLGRAGon0ka6jCl3ZF1IAQetV-WjTomgUgaEs48FA8SScMtr_0JIxxptg6KL5tqSXjwo';
    const firebaseConfig = {
      apiKey: 'AIzaSyCxYjffm9bKBNZ0x-4Us0F_ERIgbp9LqrI',
      authDomain: 'push-demo-10d34.firebaseapp.com',
      projectId: 'push-demo-10d34',
      storageBucket: 'push-demo-10d34.firebasestorage.app',
      messagingSenderId: '489596640686',
      appId: '1:489596640686:web:fb29b72efbc98b7a183c3f'
    };

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const messaging = getMessaging(initializeApp(firebaseConfig));

    const $ = id => document.getElementById(id);
    const joinEl = $('join');
    const joinForm = $('joinForm');
    const nameInput = $('nameInput');
    const listEl = $('messages');
    const sendForm = $('sendForm');
    const textInput = $('text');
    const notifyBtn = $('notify');
    const statusEl = $('status');

    let myName = localStorage.getItem('chatName') || '';
    const seen = new Set();

    function addMessage(m) {
      if (seen.has(m.id)) return;
      seen.add(m.id);

      const div = document.createElement('div');
      div.className = 'msg' + (m.sender === myName ? ' mine' : '');

      const who = document.createElement('div');
      who.className = 'who';
      who.textContent = m.sender;

      const text = document.createElement('div');
      text.className = 'text';
      text.textContent = m.body;

      div.append(who, text);
      listEl.appendChild(div);
      listEl.scrollTop = listEl.scrollHeight;
    }

    // Listen first, then load history. Duplicates are skipped by id.
    function listenForMessages() {
      supabase.channel('chat')
        .on('postgres_changes',
          { event: 'INSERT', schema: 'public', table: 'messages' },
          payload => addMessage(payload.new))
        .subscribe();
    }

    async function loadHistory() {
      const { data, error } = await supabase
        .from('messages')
        .select('*')
        .order('created_at', { ascending: true })
        .limit(200);
      if (error) {
        statusEl.textContent = 'Could not load messages: ' + error.message;
        return;
      }
      data.forEach(addMessage);
    }

    async function setupPush() {
      if (!('serviceWorker' in navigator) || !('Notification' in window)) {
        statusEl.textContent = 'This browser does not support notifications.';
        return;
      }

      // Must run directly from a click, or on a page the user already granted
      const permission = await Notification.requestPermission();
      if (permission !== 'granted') {
        statusEl.textContent = 'Notifications are off. You can still chat.';
        notifyBtn.hidden = false;
        return;
      }

      const reg = await navigator.serviceWorker.register('./firebase-messaging-sw.js');
      await navigator.serviceWorker.ready;

      const token = await getToken(messaging, {
        vapidKey: VAPID_KEY,
        serviceWorkerRegistration: reg
      });
      if (!token) throw new Error('No token returned');

      const res = await fetch(SERVER_URL + '/api/register-token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, name: myName })
      });
      if (!res.ok) throw new Error('register-token returned ' + res.status);

      notifyBtn.hidden = true;
      statusEl.textContent = 'Notifications on for ' + myName + '.';
    }

    function reportError(err) {
      statusEl.textContent = 'Error: ' + err.message;
    }

    joinForm.addEventListener('submit', e => {
      e.preventDefault();
      myName = nameInput.value.trim().slice(0, 30);
      if (!myName) return;
      localStorage.setItem('chatName', myName);
      joinEl.hidden = true;

      // Call first, before any other await, so the permission prompt is allowed
      setupPush().catch(reportError);
      listenForMessages();
      loadHistory();
    });

    notifyBtn.addEventListener('click', () => {
      setupPush().catch(reportError);
    });

    sendForm.addEventListener('submit', async e => {
      e.preventDefault();
      const body = textInput.value.trim();
      if (!body) return;
      textInput.value = '';

      try {
        const res = await fetch(SERVER_URL + '/api/message', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sender: myName, body })
        });
        if (!res.ok) throw new Error('send returned ' + res.status);
        const data = await res.json();
        addMessage(data.message);
      } catch (err) {
        reportError(err);
      }
    });

    // Startup
    if (myName) {
      joinEl.hidden = true;
      listenForMessages();
      loadHistory();
      if (Notification.permission === 'granted') {
        setupPush().catch(reportError);
      } else {
        notifyBtn.hidden = false;
      }
    } else {
      joinEl.hidden = false;
      nameInput.focus();
    }
  </script>
</body>
</html>
